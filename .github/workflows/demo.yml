name: Demo

# Records the README's demo GIF on a Windows runner's own desktop, since the recording moves the real mouse. Run it by
# hand, and commit the GIF from its artifact.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  record:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the sample
        run: dotnet build samples/Oopsling.Sample --configuration Release

      - name: Install ffmpeg
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }

      - name: Record
        timeout-minutes: 5
        run: |
          $env:PATH = "$env:ChocolateyInstall\bin;$env:PATH"
          ./scripts/record-demo.ps1 samples/Oopsling.Sample/bin/Release/net10.0/Oopsling.Sample.exe demo.gif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo
          path: demo.gif
          if-no-files-found: error
