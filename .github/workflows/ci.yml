name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: .exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: ""
          - os: macos-latest
            rid: osx-arm64
            exe: ""
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Oopsling.slnx

      - name: Build
        run: dotnet build Oopsling.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Oopsling.slnx --configuration Release --no-build

      - name: Format
        run: dotnet format Oopsling.slnx --verify-no-changes --no-restore

      - name: Pack
        run: dotnet pack Oopsling.slnx --configuration Release --no-build --output artifacts/packages

      # Trim and AOT warnings are errors, so a package that breaks a NativeAOT host fails here.
      - name: Publish the sample (NativeAOT)
        run: dotnet publish samples/Oopsling.Sample --configuration Release --runtime ${{ matrix.rid }} --output artifacts/publish

      # M1's done line: both builds, crashed on the UI thread and on a background thread, leave a report.
      - name: Crash the sample and check its reports
        shell: bash
        timeout-minutes: 5
        run: |
          scripts/crash-check.sh "samples/Oopsling.Sample/bin/Release/net10.0/Oopsling.Sample${{ matrix.exe }}" no
          scripts/crash-check.sh "artifacts/publish/Oopsling.Sample${{ matrix.exe }}" yes

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # Copied from that release's checksums file. Bump both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release binary, pinned by checksum: the gitleaks Action needs a paid license for orgs.
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/$checksums"
          grep -qx "$GITLEAKS_SHA256  $tarball" "$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar -xzf "$tarball" gitleaks

      # Positive control: the token is built at run time, so no literal reaches the history.
      - name: Check gitleaks catches a planted token
        run: |
          dir="$(mktemp -d)"
          echo "token = \"ghp_$(openssl rand -hex 18)\"" > "$dir/leak.txt"
          if "$RUNNER_TEMP/gitleaks" dir "$dir" --no-banner --redact; then
            echo "gitleaks missed a planted token"
            exit 1
          fi

      # Only HEAD's history: scanning every ref would let one branch's leak fail every run.
      - name: Scan the full history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts="--full-history HEAD" --no-banner --redact --verbose
